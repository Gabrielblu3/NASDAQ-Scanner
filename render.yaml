services:
  - type: web
    name: volatilityterminal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run nasdaq_scanner/dashboard.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
